<main class="container mt-4">
  <h1 class="mb-3">Catálogo de Livros</h1>

  <table class="table table-striped align-middle">
    <thead class="table-dark">
      <tr>
        <th style="width: 25%;">Título</th>
        <th style="width: 35%;">Resumo</th>
        <th style="width: 20%;">Editora</th>
        <th style="width: 20%;">Autores</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let livro of livros">
        <td>
          <div>{{ livro.titulo }}</div>
          <button
            type="button"
            class="btn btn-danger btn-sm mt-1"
            (click)="excluir(livro.codigo)"
          >
            Excluir
          </button>
        </td>
        <td>{{ livro.resumo }}</td>
        <td>{{ obterNome(livro.codEditora) }}</td>
        <td>
          <ul class="mb-0 ps-3">
            <li *ngFor="let autor of livro.autores">{{ autor }}</li>
          </ul>
        </td>
      </tr>
    </tbody>
  </table>
</main>
